name: Supabase Keepalive

# Free-tier Supabase projects pause after 7 days with no API activity.
# This pings the REST API every 3 days so the /secret page's database
# never goes to sleep.
on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" \
            -H "apikey: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}" \
            "${{ secrets.PUBLIC_SUPABASE_URL }}/rest/v1/secret_paste?select=id&limit=1"
